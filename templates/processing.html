<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Processing Files</h1>
        <p>Please wait while we process your files...</p>
        <div class="progress mb-3">
            <div class="progress-bar" role="progressbar" style="width: 0%" id="progressBar"></div>
        </div>
        <p id="status">Status: Idle</p>
        <p id="elapsed">Elapsed Time: 0 seconds</p>
        <div id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Processing...</span>
            </div>
        </div>
    </div>
    <script>
        function updateProgress() {
            fetch('/progress')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status').textContent = 'Status: ' + data.status;
                    document.getElementById('elapsed').textContent = 'Elapsed Time: ' + data.elapsed_time + ' seconds';
                    if (data.total_files > 0) {
                        const percentage = (data.processed_files / data.total_files) * 100;
                        document.getElementById('progressBar').style.width = percentage + '%';
                    }
                    if (data.status === 'Completed') {
                        window.location.href = '/results';
                    } else {
                        setTimeout(updateProgress, 1000);
                    }
                })
                .catch(error => {
                    console.error('Error fetching progress:', error);
                    setTimeout(updateProgress, 1000);
                });
        }
        updateProgress();
    </script>
</body>
</html>
