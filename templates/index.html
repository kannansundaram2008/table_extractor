<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSR Extract</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>Document Table Row Extractor</h1>
            <p>Select a folder containing .doc and .docx files to extract specific rows from tables.</p>
        </div>
        <div class="tab-content">
            <form method="post" enctype="multipart/form-data">
                <div class="metric-card">
                    <label for="files" class="form-label">Select Files or Folder</label>
                    <input type="file" class="form-control" id="files" name="files" multiple webkitdirectory>
                    <div id="dropZone" style="border: 2px dashed var(--secondary-color); padding: 1rem; margin-top: 1rem; text-align: center; min-height: 100px; border-radius: var(--border-radius);">
                        Or drag and drop files/folders here
                    </div>
                    <div id="fileList" style="margin-top: 1rem;"></div>
                </div>
                <button type="submit" class="btn-custom btn-primary-custom" id="submitBtn">Process Files</button>
            </form>
            <div id="loading" style="display: none; margin-top: 1rem;">
                <div class="loading-spinner"></div>
                <span>Processing files, please wait...</span>
            </div>
        </div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</body>
</html>
