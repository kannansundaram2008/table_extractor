<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSR Extract</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Document Table Row Extractor</h1>
        <p>Select a folder containing .doc and .docx files to extract specific rows from tables.</p>
        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="files" class="form-label">Select Files or Folder</label>
                <input type="file" class="form-control" id="files" name="files" multiple webkitdirectory>
                <div id="dropZone" class="border border-dashed border-secondary p-4 mt-2 text-center" style="min-height: 100px;">
                    Or drag and drop files/folders here
                </div>
                <div id="fileList" class="mt-2"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Process Files</button>
        </form>
        <div id="loading" class="mt-3" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Processing...</span>
            </div>
            <span>Processing files, please wait...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</body>
</html>
